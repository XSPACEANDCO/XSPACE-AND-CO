# Render blueprint: one web service that serves the API *and* the built React
# app, plus a Postgres database. Import it from the Render dashboard with
# New -> Blueprint, pointed at this repo.
#
# One service rather than two keeps it on the free tier and means the browser
# never makes a cross-origin call, so there is no CORS to configure for the
# web frontend. The Android app is a different story: it runs at
# capacitor://localhost, a genuinely different origin from this API, so it
# needs the CORS_ORIGINS entry below or every request gets blocked.

services:
  - type: web
    name: xspace-portal
    runtime: node
    plan: free
    # Build the frontend, then install the server's own dependencies.
    #
    # --include=dev on the frontend install: NODE_ENV=production below applies
    # during the build step too, and a plain `npm ci` skips devDependencies
    # under NODE_ENV=production — which is where vite lives. Without this the
    # build fails with "Cannot find module '.../vite/bin/vite.js'".
    buildCommand: cd xspace-portal-react && npm ci --include=dev && npm run build && cd ../server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: xspace-db
          property: connectionString

      # Generated once and kept. Rotating it signs everyone out.
      - key: JWT_SECRET
        generateValue: true

      - key: STATIC_DIR
        value: ../xspace-portal-react/dist

      # Lets the Android app (capacitor://localhost) call this API. Not
      # needed by the web frontend, which is same-origin with it.
      - key: CORS_ORIGINS
        value: capacitor://localhost,https://localhost,http://localhost

      # No demo accounts in production. Flip to "true" only if you want the
      # five shared-password logins for a walkthrough.
      - key: SEED_DEMO
        value: "false"

      # Your first real Founder. Set both in the dashboard before the first
      # deploy — the free tier has no shell, so this is the only way in.
      # Afterwards: sign in, change the password, clear BOOTSTRAP_PASSWORD.
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
      - key: BOOTSTRAP_NAME
        sync: false

databases:
  - name: xspace-db
    plan: free
    databaseName: xspace
    user: xspace
