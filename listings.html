<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Xspace & Co | Listings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0b0b0b;
  --panel:#0f1720;
  --fg:#fff;
  --muted:#9aa0a6;
  --accent:#10b981;
  --border:rgba(255,255,255,0.08);
  font-family: Inter, system-ui;
}
body{margin:0;background:var(--bg);color:var(--fg);}
.container{padding:20px;}
h1{margin:0 0 6px;}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

button{
  background:var(--accent);
  color:#000;
  border:0;
  padding:8px 14px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--panel);
  border-radius:12px;
  overflow:hidden;
}
th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
  font-size:14px;
}
th{color:var(--muted);font-weight:500;}
tr:hover{background:rgba(255,255,255,0.03);}

/* badges */
.badge{padding:4px 10px;border-radius:999px;font-size:12px;}
.unverified{background:#64748b;}
.verified{background:#22c55e;color:#000;}
.rejected{background:#ef4444;}

.small{font-size:12px;color:var(--muted);}
.action-btn{
  background:transparent;
  border:1px solid var(--border);
  color:var(--fg);
  padding:4px 10px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="container">

  <div class="top-bar">
    <div>
      <h1>Listings</h1>
      <p class="small">All submitted inventory (internal)</p>
    </div>

    <button onclick="addListing()">+ Add Listing</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Listing</th>
        <th>Location</th>
        <th>Price</th>
        <th>Submitted By</th>
        <th>Status</th>
        <th id="actionCol">Action</th>
      </tr>
    </thead>
    <tbody id="listingTable"></tbody>
  </table>

</div>

<script>
/* ======================
   AUTH (demo simulation)
   Change role to test:
   founder | core | agent | creator
   ====================== */
const currentUser = {
  id: "u3",
  name: "Sai",
  role: "agent" // change this to test
};

/* ======================
   LISTINGS DATA
   ====================== */
let listings = [
  {
    id:1,
    title:"MyHome Avatar – 3BHK",
    location:"Tellapur",
    price:"₹1.15 Cr",
    submittedBy:"u3",
    submittedByName:"Sai",
    status:"unverified"
  },
  {
    id:2,
    title:"Vasavi Skyla – 2BHK",
    location:"Nallagandla",
    price:"₹92 L",
    submittedBy:"u2",
    submittedByName:"Karthik",
    status:"verified"
  },
  {
    id:3,
    title:"Standalone Apartment",
    location:"Miyapur",
    price:"₹68 L",
    submittedBy:"u4",
    submittedByName:"Priya",
    status:"unverified"
  }
];

const tbody = document.getElementById("listingTable");
const actionCol = document.getElementById("actionCol");

/* ======================
   VISIBILITY LOGIC
   ====================== */
function canSeeAll(){
  return currentUser.role === "founder" || currentUser.role === "core";
}
function canVerify(){
  return currentUser.role === "founder" || currentUser.role === "core";
}

/* ======================
   RENDER
   ====================== */
function renderListings(){
  tbody.innerHTML = "";

  const visibleListings = canSeeAll()
    ? listings
    : listings.filter(l => l.submittedBy === currentUser.id);

  if(!canVerify()) actionCol.style.display = "none";

  visibleListings.forEach(l=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td><strong>${l.title}</strong></td>
      <td>${l.location}</td>
      <td>${l.price}</td>
      <td>
        ${l.submittedByName}
        ${l.submittedBy === currentUser.id ? "<div class='small'>(You)</div>" : ""}
      </td>
      <td>
        <span class="badge ${l.status}">
          ${capitalize(l.status)}
        </span>
      </td>
      <td>
        ${canVerify() && l.status === "unverified"
          ? `<button class="action-btn" onclick="verifyListing(${l.id})">Verify</button>`
          : ""
        }
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function capitalize(t){
  return t.charAt(0).toUpperCase() + t.slice(1);
}

/* ======================
   ACTIONS
   ====================== */
function addListing(){
  const title = prompt("Listing title:");
  if(!title) return;

  listings.push({
    id: Date.now(),
    title,
    location:"—",
    price:"—",
    submittedBy: currentUser.id,
    submittedByName: currentUser.name,
    status:"unverified"
  });

  renderListings();
}

function verifyListing(id){
  const idx = listings.findIndex(l=>l.id===id);
  if(idx > -1){
    listings[idx].status = "verified";
    alert("Listing verified. Ready to move to Projects.");
    renderListings();
  }
}

renderListings();
</script>
</body>
</html>
